[package]
name = "chuck-snap-stack"
version = "1.0.1"
description = "Chuck Snap Stack - Media Manager & Viewer"
authors = ["irnagisa"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "chuck_snap_stack_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
tokio = { version = "1", features = ["time", "process", "rt", "net", "sync", "io-util", "macros"] }
tokio-util = { version = "0.7", features = ["io"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }
rusqlite = { version = "0.31", features = ["bundled"] }
which = "6"
notify = "6"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
futures-util = "0.3"
log = "0.4"
trash = "5"
image = "0.25"
csv = "1.3"
sha2 = "0.10"
rand = "0.8"
sysinfo = { version = "0.32", default-features = false, features = ["disk"] }
scraper = "0.20"
tauri-plugin-wdio-webdriver = "1"
# default-features を無効化し api-22 以降を含めない: SessionBuilder::new() が
# api-22 で追加された SessionOptionsSetEpSelectionPolicy(MaxEfficiency) を無条件に呼ぶが、
# この呼び出しが Intel Mac + macOS Tahoe で EP/デバイス列挙のため無限にハングする
# (Session::builder() から一切復帰しない) 問題を確認したため、api-21 に留める。
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "load-dynamic", "ndarray", "api-21"] }
ndarray = "0.17"
